# PostgreSQL de desenvolvimento. O Django roda fora do container, pela .venv.
# Variáveis lidas do .env (modelo em .env.example).
#   Subir:  docker compose up -d
#   Parar:  docker compose stop        (mantém os dados)
name: nci-idosos

services:
  db:
    image: postgres:17-alpine
    container_name: nci-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      # Exposto só para esta máquina, na porta usada pelo Django.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
