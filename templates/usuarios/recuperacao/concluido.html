{% extends "nci/base.html" %}
{% load static %}
{% block title %}Senha alterada · NCI Idade Dourada{% endblock %}
{% block corpo %}
<main class="nci-login">
  <div class="text-center px-3">
    <img src="{% static 'img/logo-nci.png' %}" alt="Logo NCI Idade Dourada" width="90" class="mb-2">
    <h1 class="h4 mb-3 nci-titulo">Senha alterada</h1>
    <div class="nci-login-caixa text-start mx-auto">
      <p class="mb-0">Sua nova senha foi salva. Você já pode entrar no sistema com ela.</p>
    </div>
    <p class="mt-3"><a href="{% url 'entrar' %}">Voltar para a entrada</a></p>
  </div>
</main>
{% endblock %}
