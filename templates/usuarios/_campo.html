<div class="mb-3">
  <label class="form-label mb-1" for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}</label>
  {{ campo }}
  {% if campo.help_text %}<div class="form-text">{{ campo.help_text }}</div>{% endif %}
  {% if campo.errors %}<div class="text-danger small">{{ campo.errors|join:" " }}</div>{% endif %}
</div>
