<div class="nci-cartao">
  <div class="nci-cartao-titulo">Entradas e saídas</div>
  <div class="nci-cartao-corpo">
    <div class="nci-tabela table-responsive" tabindex="0" role="region" aria-label="Histórico de movimentações, tabela com rolagem"><table class="table mb-0">
      <thead><tr><th scope="col">Data</th><th scope="col">Movimentação</th><th scope="col">Motivo</th><th scope="col">Registrado por</th></tr></thead>
      <tbody>
        {% for movimento in movimentacoes %}
        <tr><td>{{ movimento.data|date:"d/m/Y" }}</td><td>{{ movimento.get_tipo_display }}</td><td>{{ movimento.motivo_descricao|default:"—" }}</td><td>{{ movimento.usuario.get_username }}</td></tr>
        {% empty %}
        <tr><td colspan="4">Sem movimentações registradas.</td></tr>
        {% endfor %}
      </tbody>
    </table></div>
  </div>
</div>
